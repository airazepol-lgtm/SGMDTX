<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三謀S5隊伍克制與兵種查詢</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); flex: 1; width: 100%; box-sizing: border-box; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }

        /* 搜尋與篩選區塊樣式 */
        .search-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .filter-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: #ecf0f1; padding: 15px; border-radius: 5px; }
        .filter-container select { flex: 1; min-width: 120px; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-size: 15px; background: white; }
        .filter-label { width: 100%; font-weight: bold; color: #34495e; margin-bottom: 5px; font-size: 14px; }
        .btn-clear { padding: 10px 15px; background: #95a5a6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; transition: background 0.3s; }
        .btn-clear:hover { background: #7f8c8d; }

        /* 卡片樣式 */
        .team-card { border-left: 5px solid #3498db; background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .team-name { font-size: 20px; font-weight: bold; color: #2980b9; margin-bottom: 10px; }
        .heroes { font-weight: bold; color: #e67e22; margin-bottom: 5px; }
        .troops { color: #7f8c8d; font-size: 14px; margin-bottom: 15px; font-weight: bold; background: #e8eaed; display: inline-block; padding: 5px 10px; border-radius: 4px; }
        .matchup { display: flex; gap: 15px; flex-wrap: wrap; }
        .good-against { flex: 1; min-width: 200px; background: #e8f8f5; padding: 12px; border-radius: 5px; border: 1px solid #a3e4d7; }
        .bad-against { flex: 1; min-width: 200px; background: #fdedec; padding: 12px; border-radius: 5px; border: 1px solid #f5b7b1; }
        .title-good { color: #17a589; font-weight: bold; margin-bottom: 8px; }
        .title-bad { color: #c0392b; font-weight: bold; margin-bottom: 8px; }
        
        /* 頁尾樣式 */
        footer { text-align: center; padding: 20px 0 10px 0; color: #7f8c8d; font-size: 14px; line-height: 1.6; margin-top: 20px; }
        .sponsor { font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h1>三謀S5隊伍克制與兵種查詢</h1>

    <input type="text" id="searchInput" class="search-box" placeholder="輸入隊伍名稱或武將 (例如: 月亮馬, SP諸葛亮)..." onkeyup="filterTeams()">
    
    <div class="filter-container">
        <div class="filter-label">🔍 兵種反查 (無須照順序，可選 1~3 個)</div>
        <select id="troop1" onchange="filterTeams()">
            <option value="">- 選擇兵種 1 -</option>
        </select>
        <select id="troop2" onchange="filterTeams()">
            <option value="">- 選擇兵種 2 -</option>
        </select>
        <select id="troop3" onchange="filterTeams()">
            <option value="">- 選擇兵種 3 -</option>
        </select>
        <button class="btn-clear" onclick="clearFilters()">清除條件</button>
    </div>

    <div id="results"></div>
</div>

<footer>
    自用 by 飛羽舞霜<br>
    由<span class="sponsor">男娘基金會</span>贊助<br>
    2/7/2026 更新
</footer>

<script>
    let teamData = [];

    // 載入 S5 的 JSON 資料
    fetch('data_s5.json')
        .then(response => response.json())
        .then(data => {
            // 過濾掉沒有隊伍名稱的無效資料，避免空白框
            teamData = data.filter(team => team.name && team.name.toString().trim() !== '');
            populateTroopDropdowns(teamData);
            displayTeams(teamData);
        })
        .catch(error => {
            console.error('無法載入資料:', error);
            document.getElementById('results').innerHTML = '<p style="color:red; text-align:center;">資料載入失敗，請確認 data_s5.json 存在且伺服器已啟動。</p>';
        });

    // 動態萃取 S5 兵種，遇到 "槍/弓" 會自動拆分成獨立的 "槍" 和 "弓"
    function populateTroopDropdowns(data) {
        let troopsSet = new Set();
        data.forEach(team => {
            [team.special1, team.special2, team.special3].forEach(spec => {
                if (spec) {
                    // 以斜線切割字串，並移除多餘空白
                    spec.toString().split('/').forEach(t => {
                        let cleanTroop = t.trim();
                        if (cleanTroop) troopsSet.add(cleanTroop);
                    });
                }
            });
        });

        let sortedTroops = Array.from(troopsSet).sort();
        
        ['troop1', 'troop2', 'troop3'].forEach(selectId => {
            let selectElement = document.getElementById(selectId);
            sortedTroops.forEach(troop => {
                let option = document.createElement('option');
                option.value = troop;
                option.text = troop;
                selectElement.appendChild(option);
            });
        });
    }

    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('troop1').value = '';
        document.getElementById('troop2').value = '';
        document.getElementById('troop3').value = '';
        filterTeams();
    }

    function displayTeams(teams) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if(teams.length === 0) {
            resultsDiv.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">找不到符合此組合的隊伍。</p>';
            return;
        }

        teams.forEach(team => {
            const card = document.createElement('div');
            card.className = 'team-card';
            
            // 合併顯示武將，過濾掉空的欄位
            const heroList = [team.hero1, team.hero2, team.hero3].filter(h => h && h.trim() !== '').join(' / ');
            // 兵種顯示
            const troopList = [team.special1, team.special2, team.special3].filter(t => t && t.trim() !== '').join(' / ');

            // 如果欄位為空就不顯示，保持卡片乾淨
            let matchupGoodHTML = team['優'] && team['優'].trim() !== '' ? `<div>${team['優']}</div>` : `<div style="color:#aaa;">無資料</div>`;
            let matchupBadHTML = team['劣'] && team['劣'].trim() !== '' ? `<div>${team['劣']}</div>` : `<div style="color:#aaa;">無資料</div>`;

            card.innerHTML = `
                <div class="team-name">${team.name}</div>
                ${heroList ? `<div class="heroes">武將組合：${heroList}</div>` : ''}
                ${troopList ? `<div class="troops">兵種：${troopList}</div>` : ''}
                <div class="matchup">
                    <div class="good-against">
                        <div class="title-good">⚔️ 優勢對局</div>
                        ${matchupGoodHTML}
                    </div>
                    <div class="bad-against">
                        <div class="title-bad">🛡️ 劣勢對局</div>
                        ${matchupBadHTML}
                    </div>
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function filterTeams() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const t1 = document.getElementById('troop1').value;
        const t2 = document.getElementById('troop2').value;
        const t3 = document.getElementById('troop3').value;

        const filtered = teamData.filter(team => {
            // 文字搜尋
            const textMatch = (team.name && team.name.toLowerCase().includes(query)) ||
                              (team.hero1 && team.hero1.toLowerCase().includes(query)) ||
                              (team.hero2 && team.hero2.toLowerCase().includes(query)) ||
                              (team.hero3 && team.hero3.toLowerCase().includes(query));
            
            // 兵種無序比對 (支援複合兵種解析)
            let requiredTroops = [t1, t2, t3].filter(t => t !== "");
            
            // 將每個欄位的兵種拆開變成陣列的陣列：例如 [['槍','弓'], ['盾'], ['騎']]
            let teamTroopsSlots = [
                team.special1 ? team.special1.toString().split('/').map(s => s.trim()) : [],
                team.special2 ? team.special2.toString().split('/').map(s => s.trim()) : [],
                team.special3 ? team.special3.toString().split('/').map(s => s.trim()) : []
            ];

            let troopMatch = true;

            // 對於每一個使用者指定的兵種需求
            for (let req of requiredTroops) {
                // 找尋這個兵種是否存在於隊伍的任何一個尚未被分配的武將槽位中
                let foundIndex = teamTroopsSlots.findIndex(slot => slot.includes(req));
                if (foundIndex !== -1) {
                    // 如果找到了，就把這個槽位從可匹配的陣列中移除，避免重複使用
                    // (例如: 使用者選了兩個"槍"，隊伍必須在兩個不同的槽位都有"槍"才符合)
                    teamTroopsSlots.splice(foundIndex, 1); 
                } else {
                    troopMatch = false;
                    break;
                }
            }

            return textMatch && troopMatch;
        });
        
        displayTeams(filtered);
    }
</script>

</body>
</html>
